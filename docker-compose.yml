# Static Mamba client behind host-edge Caddy at /mamba/.
# Auth / DB / verify-score stay on cloud Supabase.
services:
  web:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_BASE_PATH: /mamba/
    ports:
      # Localhost-only debugging; public HTTPS comes from the host-level proxy.
      - "127.0.0.1:34364:80"
    networks:
      default: {}
      edge:
        aliases:
          - mamba
    restart: unless-stopped

networks:
  edge:
    external: true
    name: host-edge
