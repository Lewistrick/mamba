server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep Location relative so Caddy's HTTPS host is preserved.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Trailing slash for the path-prefixed SPA.
    location = /mamba {
        return 302 /mamba/;
    }

    location /mamba/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /mamba/ {
        try_files $uri $uri/ /mamba/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
