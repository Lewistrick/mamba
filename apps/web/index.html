<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="menu" aria-label="Game menu">
        <h1>MAMBA</h1>
        <p class="menu-sub">1989 · Bert Uffen</p>

        <fieldset class="size-field">
          <legend>Board size</legend>
          <label
            ><input type="radio" name="size" value="small" /> Small
            <span>11×20</span></label
          >
          <label
            ><input type="radio" name="size" value="medium" checked /> Medium
            <span>22×40</span></label
          >
          <label
            ><input type="radio" name="size" value="large" /> Large
            <span>33×60</span></label
          >
        </fieldset>

        <label class="sound-toggle">
          <input type="checkbox" id="sound-enabled" checked />
          Sound <span class="key-hint">(S)</span>
        </label>

        <button type="button" id="btn-play" class="primary">Play</button>

        <section id="auth-panel" class="auth-panel" hidden>
          <h2>Account</h2>
          <p id="auth-status" class="auth-status">Guest — local scores only</p>
          <form id="auth-form" class="auth-form">
            <label class="name-label">
              Email
              <input id="auth-email" type="email" autocomplete="email" required />
            </label>
            <button type="submit" id="btn-magic-link" class="secondary">Email magic link</button>
            <p id="auth-confirm" class="auth-confirm" hidden></p>
          </form>
          <form id="username-form" class="auth-form" hidden>
            <p class="hint">Choose a username before you play (locked afterward).</p>
            <label class="name-label">
              Username
              <input
                id="account-username"
                type="text"
                maxlength="12"
                autocomplete="nickname"
                spellcheck="false"
                required
              />
            </label>
            <button type="submit" class="secondary">Save username</button>
          </form>
          <p id="account-username-label" class="auth-status" hidden></p>
          <button type="button" id="btn-sign-out" class="secondary" hidden>Sign out</button>
        </section>

        <section class="leaderboard" aria-label="Leaderboard">
          <div class="lb-header">
            <h2>Scores</h2>
          </div>
          <div class="lb-filters">
            <select id="lb-scope" aria-label="Scope">
              <option value="local">Local</option>
              <option value="global">Global</option>
            </select>
            <select id="lb-period" aria-label="Period">
              <option value="all">All-time</option>
              <option value="weekly">Weekly</option>
              <option value="daily">Daily</option>
            </select>
          </div>
          <ol id="lb-list" class="lb-list"></ol>
          <p id="lb-empty" class="lb-empty">No scores yet</p>
        </section>

        <p id="status" class="status" role="status"></p>
        <p class="hint">Arrows to steer · S sound</p>
      </aside>

      <div id="stage">
        <div id="playfield" class="playfield">
          <canvas id="game" width="800" height="520" aria-label="Mamba game field"></canvas>
          <div id="gameover-overlay" class="gameover-overlay" hidden>
            <p class="go-title">GAME OVER</p>
            <p id="go-score" class="go-score">Score: 0</p>
            <form id="guest-score-form" class="guest-score-form">
              <label class="name-label">
                Name
                <input
                  id="guest-name"
                  type="text"
                  maxlength="12"
                  autocomplete="nickname"
                  spellcheck="false"
                />
              </label>
              <button type="submit" class="primary">Save score</button>
            </form>
            <button type="button" id="btn-play-again" class="secondary">Play again</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
