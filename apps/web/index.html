<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAMBA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside id="menu" aria-label="Game menu">
        <h1>MAMBA</h1>
        <p class="menu-sub">1989 · Bert Uffen</p>

        <fieldset class="size-field">
          <legend>Board size</legend>
          <label
            ><input type="radio" name="size" value="small" /> Small
            <span>11×20</span></label
          >
          <label
            ><input type="radio" name="size" value="medium" checked /> Medium
            <span>22×40</span></label
          >
          <label
            ><input type="radio" name="size" value="large" /> Large
            <span>33×60</span></label
          >
        </fieldset>

        <label class="sound-toggle">
          <input type="checkbox" id="sound-enabled" checked />
          Sound <span class="key-hint">(S)</span>
        </label>

        <button type="button" id="btn-play" class="primary">Play</button>

        <section id="auth-panel" class="auth-panel" hidden>
          <h2>Account</h2>
          <p id="auth-status" class="auth-status">Guest — local scores only</p>
          <form id="auth-form" class="auth-form">
            <label class="name-label">
              Email
              <input id="auth-email" type="email" autocomplete="email" required />
            </label>
            <button type="submit" id="btn-magic-link" class="secondary">Email magic link</button>
          </form>
          <button type="button" id="btn-sign-out" class="secondary" hidden>Sign out</button>
        </section>

        <section id="highscore-panel" class="highscore-panel" hidden>
          <h2>High score!</h2>
          <label class="name-label">
            Name
            <input
              id="player-name"
              type="text"
              maxlength="12"
              autocomplete="nickname"
              spellcheck="false"
            />
          </label>
          <button type="button" id="btn-save-score" class="secondary">Save score</button>
          <p id="global-save-hint" class="hint" hidden>Signed in — also submits to the global board</p>
        </section>

        <section class="leaderboard" aria-label="Leaderboard">
          <div class="lb-header">
            <h2>Scores</h2>
          </div>
          <div class="lb-filters">
            <select id="lb-scope" aria-label="Scope">
              <option value="local">Local</option>
              <option value="global">Global</option>
            </select>
            <select id="lb-period" aria-label="Period">
              <option value="all">All-time</option>
              <option value="weekly">Weekly</option>
              <option value="daily">Daily</option>
            </select>
          </div>
          <ol id="lb-list" class="lb-list"></ol>
          <p id="lb-empty" class="lb-empty">No scores yet</p>
        </section>

        <p id="status" class="status" role="status"></p>
        <p class="hint">Arrows to steer · S sound</p>
      </aside>

      <div id="stage">
        <canvas id="game" width="800" height="520" aria-label="Mamba game field"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
